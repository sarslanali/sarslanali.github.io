cv:
  name: Dr. Arslan Ali Syed
  headline: Research Scientist | Transportation Systems, Optimization & Simulation
  label: Research Scientist | Transportation Systems, Optimization & Simulation
  email: arslanali.syed@outlook.com
  location: Munich, Germany
  address:
    city: Munich
    region: Germany
    countryCode: DE
  summary: >-
    Research scientist with a Ph.D. in Transportation Engineering and an M.Sc.
    in Computational Science and Engineering from the Technical University of
    Munich (TUM). Experienced in optimization, multi-agent simulation, machine
    learning, and control, with applications in transportation systems.
    Previous experience includes academic and industrial research at TUM,
    BMW, and Infineon Technologies. Research interests include modelling of
    complex transportation systems, multi-agent systems, self-adaptive digital
    twins, and reinforcement learning.
  social_networks:
    - network: LinkedIn
      username: arslan-ali-syed
    - network: GitHub
      username: sarslanali

  sections:
    Key Achievements:
      - bullet: '**Patents:** Inventor on six published BMW patents related to mobility optimization.'
      - bullet: '**Research Publications:** Five journal and twelve conference papers; Google Scholar h-index of 8 (as reported in the supplied CV).'
      - bullet: '**Research Software:** Founding co-developer of FleetPy, used in more than ten TUM research projects.'

    Experience:
      - company: Technical University of Munich
        position: Postdoctoral Researcher / Research Associate
        location: Munich, Germany
        start_date: '2021-02'
        end_date: '2025-10'
        summary: 'Research Associate until February 2024; Postdoctoral Researcher from February 2024 to October 2025.'
        highlights:
          - 'Group Leader, **Test Fields and Simulators**: coordinated research activities of PhD researchers working on simulation platforms and digital twins.'
          - 'Founding co-developer and contributor to **FleetPy**, an open-source simulation framework for mobility-on-demand systems and associated optimization problems; used in more than ten research projects at TUM.'
          - Developed demand forecasting, fleet repositioning, and assignment methods for mobility-on-demand systems.
          - Developed algorithms to control coordinated movement of connected autonomous vehicles in lane-free traffic.
          - Conducted and coordinated research activities in two projects and contributed to research proposals.
          - Contributed to MSc teaching in Traffic Control Basics and Object Oriented Programming for Transportation Engineers.
          - Guided tender-based procurement of a **€220K driving simulator** for research on human driving behaviour.
          - Supervised **10 M.Sc. theses** covering simulation and optimization topics.

      - company: Mobility Services, BMW Group
        position: Research Associate
        location: Munich, Germany
        start_date: '2017-04'
        end_date: '2020-12'
        highlights:
          - Built fleet-management algorithms using traditional optimization and machine-learning-based methods; published four research papers on the topic.
          - Inventor on **six published BMW patent applications** related to optimization and machine learning for mobility services.

